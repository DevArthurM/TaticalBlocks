# TaticalBlocks — `docker compose up -d --build` e abra http://localhost:3000
name: tatical-blocks
services:
  tatical-blocks:
    build: .
    image: tatical-blocks:latest
    container_name: tatical-blocks
    restart: unless-stopped
    environment:
      PORT: 3260
    ports:
      # mude a porta da esquerda para publicar em outra (ex.: "8080:3000")
      - "${TB_PORT:-3000}:3000"
