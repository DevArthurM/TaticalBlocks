# TaticalBlocks — `docker compose up -d --build` e abra http://localhost:3260
name: tatical-blocks
services:
  tatical-blocks:
    build: .
    image: tatical-blocks:latest
    container_name: tatical-blocks
    restart: unless-stopped
    environment:
      PORT: 3260
    ports:
      # a porta da direita é a do servidor (PORT); mude a da esquerda para publicar em outra (ex.: TB_PORT=8080)
      - "${TB_PORT:-3260}:3260"
